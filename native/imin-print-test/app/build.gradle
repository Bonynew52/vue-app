plugins {
    id "com.android.application"
}

def readEnvFile(File file) {
    def values = [:]
    if (!file.exists()) {
        return values
    }
    file.eachLine { line ->
        def trimmed = line.trim()
        if (!trimmed || trimmed.startsWith("#") || !trimmed.contains("=")) {
            return
        }
        def parts = trimmed.split("=", 2)
        def value = parts[1].trim()
        if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
            value = value.substring(1, value.length() - 1)
        }
        values[parts[0].trim()] = value
    }
    return values
}

def localEnv = readEnvFile(rootProject.file("../../.env.local"))
def sentryBuildEnv = readEnvFile(rootProject.file("../../.env.sentry-build"))
def propValue(String name) {
    def value = project.findProperty(name)
    return value == null ? "" : String.valueOf(value)
}

def sentryDsn = propValue("sentryDsn")
        ?: System.getenv("SENTRY_DSN")
        ?: System.getenv("VITE_SENTRY_DSN")
        ?: localEnv["SENTRY_DSN"]
        ?: localEnv["VITE_SENTRY_DSN"]
        ?: sentryBuildEnv["SENTRY_DSN"]
        ?: sentryBuildEnv["VITE_SENTRY_DSN"]
        ?: ""
def convexHttpBaseUrl = propValue("convexHttpBaseUrl")
        ?: System.getenv("CONVEX_HTTP_BASE_URL")
        ?: System.getenv("VITE_CONVEX_SITE_URL")
        ?: localEnv["CONVEX_HTTP_BASE_URL"]
        ?: localEnv["VITE_CONVEX_SITE_URL"]
        ?: localEnv["VITE_CONVEX_URL"]
        ?: ""
def printerAgentToken = propValue("printerAgentToken")
        ?: System.getenv("PRINTER_AGENT_TOKEN")
        ?: localEnv["PRINTER_AGENT_TOKEN"]
        ?: sentryBuildEnv["PRINTER_AGENT_TOKEN"]
        ?: ""

if (!sentryDsn) {
    throw new GradleException("Sentry DSN is required to build the print-test APK with Sentry Logs. Set SENTRY_DSN or VITE_SENTRY_DSN.")
}
if (!convexHttpBaseUrl) {
    throw new GradleException("Convex HTTP base URL is required. Set CONVEX_HTTP_BASE_URL or VITE_CONVEX_SITE_URL.")
}
if (!printerAgentToken) {
    throw new GradleException("Printer agent token is required. Set PRINTER_AGENT_TOKEN.")
}

def javaString(String value) {
    return "\"" + value.replace("\\", "\\\\").replace("\"", "\\\"") + "\""
}

android {
    namespace "com.bellymonster.printtest"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.bellymonster.printtest"
        minSdk 23
        targetSdk 30
        versionCode 3
        versionName "0.4.0"
        buildConfigField "String", "CONVEX_HTTP_BASE_URL", javaString(convexHttpBaseUrl)
        buildConfigField "String", "PRINTER_AGENT_TOKEN", javaString(printerAgentToken)
        manifestPlaceholders = [
                sentryDsn: sentryDsn,
        ]
    }
}

dependencies {
    implementation files("libs/IminLibs1.0.15.jar")
    implementation files("libs/iminPrinterSDK-14_V1.3.1_2408141540.jar")
    implementation "io.sentry:sentry-android:8.34.0"
}
