name: Build POS APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: native/imin-print-test
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Copy APKs
        run: |
          mkdir -p public/downloads
          cp native/imin-print-test/app/build/outputs/apk/debug/app-debug.apk public/downloads/belly-imin-print-test-0.4.1.apk
          cp native/imin-print-test/app/build/outputs/apk/debug/app-debug.apk public/downloads/belly-imin-print-test.apk

      - name: Commit APK
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build POS printer APK 0.4.1"
          file_pattern: "public/downloads/belly-imin-print-test.apk public/downloads/belly-imin-print-test-0.4.1.apk"
